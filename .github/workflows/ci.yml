name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        shell: bash
        run: |
          set +e
          cargo test --locked --no-default-features > test-output.txt 2>&1
          result=$?
          cat test-output.txt
          if [ "$result" -ne 0 ]; then
            summary="$(tail -n 12 test-output.txt | tr '\n' ' ')"
            echo "::error title=Rust test failure::$summary"
            exit "$result"
          fi
      - name: Build CLI
        run: cargo build --locked --release --bin pi-clock
      - name: Smoke-test CLI commands
        run: |
          cargo run --locked --bin pi-clock -- version
          cargo run --locked --bin pi-clock -- help
