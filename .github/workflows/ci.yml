name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check package script syntax
        if: runner.os == 'Linux'
        run: sh -n packaging/linux-packages.sh
      - name: Run tests
        run: cargo test --locked --no-default-features
      - name: Build CLI
        run: cargo build --locked --release --bin pi-clock
      - name: Build tray-enabled CLI
        if: runner.os != 'Linux'
        run: cargo build --locked --release --features tray-app --bin pi-clock
      - name: Smoke-test CLI commands
        run: |
          cargo run --locked --bin pi-clock -- version
          cargo run --locked --bin pi-clock -- help
