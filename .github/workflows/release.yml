name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify-version:
    name: Verify tag matches Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check semantic version tag
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          }

  build:
    name: Build (${{ matrix.os }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release CLI
        run: cargo build --locked --release --bin pi-clock
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: tar -czf "pi-clock-${GITHUB_REF_NAME}-${{ matrix.platform }}.tar.gz" -C target/release pi-clock
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/pi-clock.exe -DestinationPath "pi-clock-$($env:GITHUB_REF_NAME)-${{ matrix.platform }}.zip"
      - name: Upload packaged CLI
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: pi-clock-*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download platform packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
