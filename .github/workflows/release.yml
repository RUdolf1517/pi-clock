name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-version:
    name: Verify tag matches Cargo version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check semantic version tag
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version v$version" >&2
            exit 1
          }

  build:
    name: Build (${{ matrix.target }})
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: pi-clock-x86_64-unknown-linux-gnu.tar.gz
            features: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: pi-clock-aarch64-unknown-linux-gnu.tar.gz
            features: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: pi-clock-aarch64-apple-darwin.tar.gz
            features: tray-app
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: pi-clock-x86_64-apple-darwin.tar.gz
            features: tray-app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: pi-clock-x86_64-pc-windows-msvc.zip
            features: tray-app
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set macOS minimum version
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - name: Build CLI without tray feature
        if: matrix.features == ''
        run: cargo build --locked --release --target ${{ matrix.target }} --bin pi-clock
      - name: Build CLI with tray feature
        if: matrix.features == 'tray-app'
        run: cargo build --locked --release --target ${{ matrix.target }} --features tray-app --bin pi-clock
      - name: Package Unix binary and checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "target/${{ matrix.target }}/release"
          tar -czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" pi-clock
          cd "$GITHUB_WORKSPACE"
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "${{ matrix.archive }}" | tee "${{ matrix.archive }}.sha256"
          else
            sha256sum "${{ matrix.archive }}" | tee "${{ matrix.archive }}.sha256"
          fi
      - name: Package Windows binary and checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Archive = "${{ matrix.archive }}"
          Compress-Archive -Path "target/${{ matrix.target }}/release/pi-clock.exe" -DestinationPath $Archive -Force
          $Hash = (Get-FileHash $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $Archive" | Set-Content -Encoding ascii -NoNewline "$Archive.sha256"
      - name: Upload platform package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [verify-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check out packaging scripts
        uses: actions/checkout@v5
      - name: Download platform packages
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Build Linux package-manager assets (.deb / .rpm)
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash -x packaging/linux-packages.sh "${RELEASE_VERSION#v}" release-assets
      - name: Create SHA-256 sums
        shell: bash
        run: |
          cd release-assets
          for file in *.tar.gz *.zip *.deb *.rpm; do
            [ -f "$file" ] && sha256sum -- "$file"
          done > SHA256SUMS
      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
